name: Weekly - Collect and Publish

on:
  schedule:
    # Run every Friday at 9 PM KST (12:00 UTC) to prepare for Saturday publication
    - cron: '0 12 * * 5'
  workflow_dispatch: # Allow manual trigger

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Collect and generate post with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts
          python collect_articles.py

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push new post
        run: |
          git add _posts/
          git add scripts/output/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TOMORROW=$(date -d "tomorrow" +%Y-%m-%d)
            git commit -m "Add Weekly - $TOMORROW

          🤖 Auto-generated with OpenAI

          Articles collected and analyzed automatically from:
          - Hacker News, GeekNews, Lobsters
          - TLDR Tech, SRE Weekly, Changelog
          - Pragmatic Engineer, Lenny's Newsletter
          - OpenTelemetry, Grafana
          - GitHub Blog, Meta Engineering, Anthropic
          - Martin Fowler"
            git push
            echo "✅ Weekly post committed and ready for Saturday publication!"
          fi

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backup
          path: |
            _posts/*weekly*.md
            scripts/output/
          retention-days: 30
